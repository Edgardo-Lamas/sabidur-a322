<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cronología paralela del cielo y la tierra entre el arrebatamiento y la Segunda Venida" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif">
  <defs>
    <style>
      .title { font-size: 22px; fill: #1A252F; font-weight: bold; }
      .subtitle { font-size: 14px; fill: #4A4A4A; font-style: italic; }
      .zone-heaven { font-size: 16px; fill: #7A5C1E; font-weight: bold; letter-spacing: 2px; }
      .zone-earth { font-size: 16px; fill: #1A1D23; font-weight: bold; letter-spacing: 2px; }
      .event { font-size: 13px; fill: #2C3E50; }
      .ref { font-size: 11px; fill: #4A4A4A; font-style: italic; }
      .foot { font-size: 13px; fill: #2C3E50; font-style: italic; }
      .note { font-size: 11px; fill: #4A4A4A; font-style: italic; }
    </style>
    <marker id="bema3-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4A4A4A"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#F9F9F7"/>

  <text x="450" y="38" text-anchor="middle" class="title">Dos escenarios, un mismo intervalo</text>
  <text x="450" y="60" text-anchor="middle" class="subtitle">El cielo y la tierra durante los siete años que separan el arrebatamiento de la Segunda Venida</text>

  <rect x="45" y="119" width="390" height="331" fill="#FCFAF4"/>
  <rect x="465" y="119" width="390" height="331" fill="#F5F5F3"/>

  <rect x="45" y="85" width="390" height="34" fill="#F6F4EE"/>
  <text x="240" y="108" text-anchor="middle" class="zone-heaven">CIELO</text>
  <rect x="465" y="85" width="390" height="34" fill="#ECECEA"/>
  <text x="660" y="108" text-anchor="middle" class="zone-earth">TIERRA</text>

  <line x1="80" y1="140" x2="80" y2="435" stroke="#C5A059" stroke-width="3"/>
  <line x1="500" y1="140" x2="500" y2="435" stroke="#8A9096" stroke-width="3"/>

  <g>
    <circle cx="80" cy="155" r="6" fill="#C5A059"/>
    <text x="98" y="160" class="event">Harpazō — resurrección y arrebatamiento</text>
    <text x="98" y="176" class="ref">(1 Ts 4:16-17)</text>

    <circle cx="80" cy="220" r="6" fill="#C5A059"/>
    <text x="98" y="225" class="event">Recepción por Cristo (Jn 14:1-3)</text>

    <circle cx="80" cy="285" r="6" fill="#C5A059"/>
    <text x="98" y="290" class="event">βῆμα de Cristo</text>
    <text x="98" y="306" class="ref">(Ro 14:10 · 2 Co 5:10 — momento exacto no revelado)</text>

    <circle cx="80" cy="350" r="6" fill="#C5A059"/>
    <text x="98" y="355" class="event">Bodas del Cordero</text>
    <text x="98" y="371" class="ref">(Ap 19:7-9)</text>

    <circle cx="80" cy="415" r="6" fill="#C5A059"/>
    <text x="98" y="420" class="event">Descenso con Cristo (Ap 19:11-14)</text>
  </g>

  <g>
    <circle cx="500" cy="155" r="6" fill="#4A4A4A"/>
    <text x="518" y="160" class="event">Inicio de la septuagésima semana (Dn 9:27)</text>

    <circle cx="500" cy="220" r="6" fill="#4A4A4A"/>
    <text x="518" y="225" class="event">Juicios de los sellos</text>

    <circle cx="500" cy="285" r="6" fill="#4A4A4A"/>
    <text x="518" y="290" class="event">Juicios de las trompetas</text>

    <circle cx="500" cy="350" r="6" fill="#4A4A4A"/>
    <text x="518" y="355" class="event">Juicios de las copas</text>

    <circle cx="500" cy="415" r="6" fill="#4A4A4A"/>
    <text x="518" y="420" class="event">Armagedón</text>
  </g>

  <line x1="80" y1="478" x2="496" y2="478" stroke="#8A9096" stroke-width="2" marker-end="url(#bema3-arrow)"/>
  <text x="450" y="507" text-anchor="middle" class="foot">Segunda Venida — convergencia de ambas líneas (Ap 19:11-21)</text>
  <text x="450" y="538" text-anchor="middle" class="note">Walvoord, Pentecost, Ryrie, Chafer y MacArthur coinciden en la secuencia; ninguno fija el día exacto del βῆμα dentro del intervalo</text>
</svg>
