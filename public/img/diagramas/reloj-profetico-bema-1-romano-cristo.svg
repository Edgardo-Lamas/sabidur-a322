<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación entre el bema romano de Corinto y el bema de Cristo" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif">
  <defs>
    <style>
      .title { font-size: 22px; fill: #1A252F; font-weight: bold; }
      .subtitle { font-size: 14px; fill: #4A4A4A; font-style: italic; }
      .colhead-light { font-size: 17px; fill: #F9F9F7; font-weight: bold; }
      .colhead-dark { font-size: 17px; fill: #1A252F; font-weight: bold; }
      .label { font-size: 14px; fill: #2C3E50; }
      .foot { font-size: 12px; fill: #4A4A4A; font-style: italic; }
    </style>
    <marker id="bema1-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#C5A059"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#F9F9F7"/>

  <text x="450" y="40" text-anchor="middle" class="title">Del βῆμα romano al βῆμα de Cristo</text>
  <text x="450" y="62" text-anchor="middle" class="subtitle">Continuidad de la institución, transformación del alcance</text>

  <rect x="50" y="88" width="350" height="287" fill="#ECECEA"/>
  <rect x="500" y="88" width="350" height="287" fill="#F6F4EE"/>

  <rect x="50" y="88" width="350" height="46" fill="#1A1D23"/>
  <text x="225" y="118" text-anchor="middle" class="colhead-light">βῆμα romano (Corinto, s. I)</text>

  <rect x="500" y="88" width="350" height="46" fill="#C5A059"/>
  <text x="675" y="118" text-anchor="middle" class="colhead-dark">βῆμα de Cristo (2 Co 5:10)</text>

  <g class="label">
    <text x="68" y="175">Magistrado provincial (Galión)</text>
    <text x="68" y="205">Autoridad delegada por Roma</text>
    <text x="68" y="235">Juicios civiles y penales, limitados</text>
    <text x="68" y="265">Pruebas y testimonios humanos</text>
    <text x="68" y="295">Sentencia temporal, apelable</text>
    <text x="68" y="325">Jurisdicción sobre una provincia</text>
    <text x="68" y="355">Examina actos externos</text>
  </g>

  <g class="label">
    <text x="518" y="175">Cristo glorificado y resucitado</text>
    <text x="518" y="205">Autoridad absoluta y propia</text>
    <text x="518" y="235">Evaluación de obras, no condena penal</text>
    <text x="518" y="265">Conocimiento perfecto (1 Co 4:5)</text>
    <text x="518" y="295">Veredicto definitivo, sin apelación</text>
    <text x="518" y="325">Jurisdicción sobre la Iglesia universal</text>
    <text x="518" y="355">Revela motivaciones (φανερόω)</text>
  </g>

  <line x1="412" y1="150" x2="488" y2="150" stroke="#C5A059" stroke-width="2" marker-end="url(#bema1-arrow)"/>
  <line x1="412" y1="230" x2="488" y2="230" stroke="#C5A059" stroke-width="2" marker-end="url(#bema1-arrow)"/>
  <line x1="412" y1="310" x2="488" y2="310" stroke="#C5A059" stroke-width="2" marker-end="url(#bema1-arrow)"/>

  <line x1="50" y1="405" x2="850" y2="405" stroke="#BDC3C7" stroke-width="1"/>
  <text x="450" y="432" text-anchor="middle" class="foot">Hechos 18:12–17 — Pablo comparece ante el βῆμα de Galión en Corinto (c. 51–52 d.C.)</text>
  <text x="450" y="454" text-anchor="middle" class="foot">Pablo toma la institución que conoció personalmente y la proyecta al plano escatológico</text>
</svg>
