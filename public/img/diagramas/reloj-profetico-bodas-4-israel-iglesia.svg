<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación entre Israel como esposa de Yahvé y la Iglesia como Esposa del Cordero, con un cierre común: sin reemplazo entre ambas" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif">
  <defs>
    <style>
      .title { font-size: 22px; fill: #1A252F; font-weight: bold; }
      .subtitle { font-size: 14px; fill: #4A4A4A; font-style: italic; }
      .colhead-dark { font-size: 17px; fill: #1A1D23; font-weight: bold; }
      .colhead-light { font-size: 17px; fill: #F9F9F7; font-weight: bold; }
      .label { font-size: 14px; fill: #2C3E50; }
      .bandtext { font-size: 17px; fill: #1A1D23; font-weight: bold; }
      .bandref { font-size: 13px; fill: #1A1D23; font-style: italic; }
    </style>
  </defs>

  <rect width="900" height="470" fill="#F9F9F7"/>

  <text x="450" y="40" text-anchor="middle" class="title">Israel e Iglesia: dos esposas, un mismo Dios fiel</text>
  <text x="450" y="62" text-anchor="middle" class="subtitle">Dos sujetos pactuales distintos, sin que uno reemplace al otro</text>

  <rect x="45" y="88" width="390" height="250" fill="#F6F4EE"/>
  <rect x="465" y="88" width="390" height="250" fill="#ECECEA"/>

  <rect x="45" y="88" width="390" height="46" fill="#C5A059"/>
  <text x="240" y="118" text-anchor="middle" class="colhead-dark">Israel</text>

  <rect x="465" y="88" width="390" height="46" fill="#1A1D23"/>
  <text x="660" y="118" text-anchor="middle" class="colhead-light">Iglesia</text>

  <g class="label">
    <text x="63" y="176">Esposa disciplinada, restaurada</text>
    <text x="63" y="232">Oseas 2 · Jeremías 2–3</text>
    <text x="63" y="252">Ezequiel 16 y 23</text>
    <text x="63" y="300">Infidelidad disciplinada,</text>
    <text x="63" y="320">nunca desechada</text>
  </g>

  <g class="label">
    <text x="483" y="176">Esposa presentada gloriosa</text>
    <text x="483" y="232">Efesios 5 · 2 Corintios 11:2</text>
    <text x="483" y="252">Apocalipsis 19</text>
    <text x="483" y="300">Santificada,</text>
    <text x="483" y="320">sin mancha ni arruga</text>
  </g>

  <rect x="45" y="366" width="810" height="68" fill="#C5A059"/>
  <text x="450" y="396" text-anchor="middle" class="bandtext">Sin reemplazo: dos sujetos, un mismo Dios fiel</text>
  <text x="450" y="419" text-anchor="middle" class="bandref">Romanos 11:29</text>
</svg>
