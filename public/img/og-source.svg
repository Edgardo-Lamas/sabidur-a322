<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D23"/>
      <stop offset="100%" stop-color="#0D0F14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDD07A"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Borde exterior sutil -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#C5A059" stroke-width="0.8" opacity="0.20"/>

  <!-- Corchete superior izquierdo -->
  <line x1="80"  y1="140" x2="80"  y2="210" stroke="#C5A059" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="80"  y1="140" x2="200" y2="140" stroke="#C5A059" stroke-width="2.5" stroke-linecap="square"/>

  <!-- Corchete inferior derecho -->
  <line x1="1120" y1="490" x2="1120" y2="420" stroke="#C5A059" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="1120" y1="490" x2="1000" y2="490" stroke="#C5A059" stroke-width="2.5" stroke-linecap="square"/>

  <!-- SABIDURÍA -->
  <text x="600" y="310"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="130"
        font-weight="700"
        fill="#C5A059"
        text-anchor="middle"
        letter-spacing="18">SABIDURÍA</text>

  <!-- Línea decorativa izquierda -->
  <line x1="80" y1="350" x2="390" y2="350" stroke="#C5A059" stroke-width="0.8" opacity="0.35"/>
  <!-- Rombo central -->
  <polygon points="600,344 608,350 600,356 592,350" fill="none" stroke="#C5A059" stroke-width="1.2" opacity="0.55"/>
  <!-- Línea decorativa derecha -->
  <line x1="810" y1="350" x2="1120" y2="350" stroke="#C5A059" stroke-width="0.8" opacity="0.35"/>

  <!-- para el Corazón -->
  <text x="600" y="410"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="52"
        font-style="italic"
        fill="#C5A059"
        text-anchor="middle"
        letter-spacing="8"
        opacity="0.90">para el Corazón</text>

  <!-- Tagline -->
  <text x="600" y="480"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        fill="#C5A059"
        text-anchor="middle"
        letter-spacing="5"
        opacity="0.42">TEOLOGÍA REFORMADA  ·  PROV. 1:7</text>
</svg>
