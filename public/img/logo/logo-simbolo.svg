<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldBody" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#7A580F"/>
      <stop offset="45%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#EDD07A"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="65%" stop-color="#F0D888"/>
      <stop offset="100%" stop-color="#FFFBE8"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#12151C"/>

  <!-- Libro — página izquierda -->
  <path d="M 55,308 L 55,202 C 90,190 138,186 188,185 L 188,297 C 142,299 96,305 55,308 Z"
        fill="#1A2035"/>
  <line x1="70"  y1="212" x2="176" y2="209" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="70"  y1="226" x2="176" y2="223" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="70"  y1="240" x2="176" y2="237" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="70"  y1="254" x2="176" y2="251" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="70"  y1="268" x2="176" y2="265" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="70"  y1="282" x2="148" y2="279" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>

  <!-- Libro — página derecha -->
  <path d="M 345,308 L 345,202 C 310,190 262,186 212,185 L 212,297 C 258,299 304,305 345,308 Z"
        fill="#1A2035"/>
  <line x1="224" y1="209" x2="330" y2="212" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="224" y1="223" x2="330" y2="226" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="224" y1="237" x2="330" y2="240" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="224" y1="251" x2="330" y2="254" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="224" y1="265" x2="330" y2="268" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>
  <line x1="252" y1="279" x2="330" y2="282" stroke="#C5A059" stroke-width="0.9" opacity="0.20"/>

  <!-- Lomo -->
  <path d="M 188,185 L 212,185 L 212,297 L 188,297 Z" fill="#0A0D14"/>
  <line x1="200" y1="185" x2="200" y2="297" stroke="#C5A059" stroke-width="0.6" opacity="0.22"/>

  <!-- Contorno -->
  <path d="M 55,308 C 102,314 150,316 188,314 C 210,316 252,314 345,308 L 345,200 C 306,187 260,183 212,183 L 188,183 C 140,183 94,187 55,200 Z"
        fill="none" stroke="#C5A059" stroke-width="1.7" stroke-linejoin="round"/>

  <!-- Páginas en el lomo -->
  <line x1="188" y1="183" x2="188" y2="177" stroke="#C5A059" stroke-width="0.6" opacity="0.35"/>
  <line x1="193" y1="182" x2="193" y2="176" stroke="#C5A059" stroke-width="0.5" opacity="0.25"/>
  <line x1="200" y1="182" x2="200" y2="176" stroke="#C5A059" stroke-width="0.6" opacity="0.35"/>
  <line x1="207" y1="182" x2="207" y2="176" stroke="#C5A059" stroke-width="0.5" opacity="0.25"/>
  <line x1="212" y1="183" x2="212" y2="177" stroke="#C5A059" stroke-width="0.6" opacity="0.35"/>

  <!-- Halo de la llama -->
  <ellipse cx="200" cy="128" rx="50" ry="72" fill="url(#flameGlow)"/>

  <!-- Llama exterior -->
  <path d="M 200,183
           C 183,157 166,130 170,94
           C 173,67  200,40  200,18
           C 200,40  227,67  230,94
           C 234,130 217,157 200,183 Z"
        fill="url(#goldBody)"/>

  <!-- Llama interior -->
  <path d="M 200,179
           C 187,155 174,130 177,99
           C 179,78  200,54  200,36
           C 200,54  221,78  223,99
           C 226,130 213,155 200,179 Z"
        fill="url(#flameInner)" filter="url(#softGlow)" opacity="0.88"/>

  <!-- Núcleo luminoso -->
  <ellipse cx="200" cy="48" rx="7" ry="12" fill="#FFFBE8" opacity="0.72" filter="url(#softGlow)"/>
</svg>
