  <!-- Open Graph por defecto — OBLIGATORIO que sea estático.
       WhatsApp, Facebook y Telegram NO ejecutan JavaScript: lo que pone
       react-helmet (SEO.jsx) en tiempo de ejecución les es invisible. Sin estas
       etiquetas acá, cualquier ruta que el middleware no intercepte se comparte
       sin vista previa. El middleware sobrescribe este HTML completo en las
       rutas que sí cubre, así que no hay conflicto.
       La URL de la imagen va absoluta y escrita a mano a propósito: con
       %VITE_SITE_URL% , si la variable falta en Vercel, Vite deja el literal
       y la vista previa se rompe en silencio. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sabiduría para el Corazón" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:title" content="Sabiduría para el Corazón - Teología Reformada" />
